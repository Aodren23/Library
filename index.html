<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Syne+Tactile&display=swap"
      rel="stylesheet"
    />
    <script src="script.js" defer></script>
    <script></script>
    <title>Document</title>
  </head>
  <body>
    <div class="library">
      <div class="header">
        <h1 class="name">Logos</h1>
        <button command="show-modal" commandfor="my-form" class="addButton rmv">
          + Add book
        </button>
      </div>
      <div class="book_display"></div>

      <dialog id="my-form">
        <p class="form-header">Add Book</p>
        <form action="#" method="post" id="form">
          <input type="text" name="" id="title" placeholder="Title" required />
          <input
            type="text"
            name=""
            id="author"
            placeholder="Author"
            required
          />
          <input
            type="number"
            name="pages"
            id="pages"
            placeholder="Page number"
            required
          />
          <div class="status-checkbox">
            <label for="status">Read: </label>
            <input type="checkbox" name="status" id="status" />
          </div>

          <div class="form-footer">
            <button
              type="button"
              commandfor="my-form"
              command="close"
              id="close"
              class="rmv"
            >
              Close
            </button>
            <!-- <button type="button" id="closeBtn">Close</button> -->
            <button type="submit" class="status">Submit</button>
          </div>
        </form>
      </dialog>
    </div>
  </body>
</html>

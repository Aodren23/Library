<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <script></script>
    <title>Document</title>
  </head>
  <body>
    <div class="library">
      <div class="header">
        <h1>Welcome to my library</h1>
        <button command="show-modal" commandfor="my-form">+ Add book</button>
      </div>
      <div class="book_display"></div>

      <!-- Form pop-up -->
      <!-- <button command="show-modal" commandfor="my-dialog">Open dialog</button> -->
      <!-- <button command="show-modal" commandfor="my-form">+ Add book</button> -->

      <dialog id="my-form">
        <form action="#" method="post">
          <div>
            <label for="title">Title: </label>
            <input
              type="text"
              name=""
              id="title"
              placeholder="Matrix..."
              required
            />
          </div>

          <div>
            <label for="author">Author: </label>
            <input
              type="text"
              name=""
              id="author"
              placeholder="Author name"
              required
            />
          </div>

          <div>
            <label for="pages">Pages: </label>
            <input
              type="number"
              name="pages"
              id="pages"
              placeholder="Page number"
              required
            />
          </div>

          <div>
            <label for="status">Read: </label>
            <input type="checkbox" name="status" id="status" required />
          </div>

          <div class="cont">
            <button type="button" commandfor="my-form" command="close">
              Close
            </button>
            <!-- <button type="button" id="closeBtn">Close</button> -->
            <button type="submit">Submit</button>
          </div>
          <!-- ////////////// -->

          <!-- <button type="button" command="close" commandfor="my-form">
            Close
          </button> -->
        </form>
      </dialog>
    </div>
  </body>
</html>
